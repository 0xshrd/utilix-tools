name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5

      # Toolchain kommt aus rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo build --release --workspace

      - name: Binaries sammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release -Filter *.exe | Copy-Item -Destination dist

      - name: Unsigniertes Artefakt hochladen
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: utilix-unsigned
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Aktiv, sobald SignPath das Projekt aufgenommen hat (Repo-Variable SIGNPATH_ENABLED=true).
      - name: Bei SignPath signieren
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: utilix-tools
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: bin

      - name: Unsigniertes Artefakt verwenden
        if: vars.SIGNPATH_ENABLED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: utilix-unsigned
          path: bin

      - name: ZIPs und Prüfsummen erstellen
        run: |
          mkdir release
          for exe in bin/*.exe; do
            name=$(basename "$exe" .exe)
            zip -j "release/${name}-${GITHUB_REF_NAME}-x64.zip" "$exe" LICENSE
          done
          cd release && sha256sum *.zip > SHA256SUMS.txt

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
