[workspace]
resolver = "3"
members = ["tools/*"]

# Gemeinsame Version für alle Tools. SignPath verlangt identische Produktversionen innerhalb eines Builds.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/0xshrd/utilix-tools"
homepage = "https://utils.grand-analytics.de"

[workspace.dependencies]
winresource = "0.1"

[profile.release]
# Auf Größe optimiert: die Tools sollen schlank bleiben.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
